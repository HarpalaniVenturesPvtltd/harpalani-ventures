<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Purple Stem Gradients -->
    <linearGradient id="hv-stem-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240742" />
      <stop offset="35%" stop-color="#4B127D" />
      <stop offset="70%" stop-color="#6F2DBD" />
      <stop offset="100%" stop-color="#2D0A54" />
    </linearGradient>

    <linearGradient id="hv-stem-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A084D" />
      <stop offset="45%" stop-color="#55158C" />
      <stop offset="85%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#320A5B" />
    </linearGradient>

    <!-- Specular Highlight for Stems -->
    <linearGradient id="hv-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#EDE5F7" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Ribbon Gradients -->
    <linearGradient id="hv-ribbon-outer" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="30%" stop-color="#9D4EDD" />
      <stop offset="65%" stop-color="#5A189A" />
      <stop offset="100%" stop-color="#240046" />
    </linearGradient>

    <linearGradient id="hv-ribbon-inner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C096C" />
      <stop offset="50%" stop-color="#621B9E" />
      <stop offset="100%" stop-color="#C77DFF" />
    </linearGradient>

    <!-- Right Flourish Wing Gradient -->
    <linearGradient id="hv-wing-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#240046" />
      <stop offset="35%" stop-color="#5A189A" />
      <stop offset="70%" stop-color="#7B2CBF" />
      <stop offset="90%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#E0AAFF" />
    </linearGradient>

    <!-- Ambient Base Shadow -->
    <radialGradient id="hv-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6F2DBD" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#32106B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <filter id="hv-soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Ambient Shadow Under Logo Mark -->
  <ellipse cx="295" cy="228" rx="140" ry="16" fill="url(#hv-shadow)" filter="url(#hv-soft-blur)" />

  <!-- ==================== HV MONOGRAM ==================== -->
  <g id="hv-mark">
    <!-- LEFT STEM OF H (Classic Flared Column) -->
    <path
      d="M 194 48 L 244 48 C 238 58, 235 68, 235 84 L 235 186 C 235 202, 238 212, 244 222 L 194 222 C 200 212, 203 202, 203 186 L 203 84 C 203 68, 200 58, 194 48 Z"
      fill="url(#hv-stem-left)"
    />
    <!-- Specular Highlight Strip down Left Stem -->
    <rect x="214" y="58" width="8" height="154" fill="url(#hv-specular)" />

    <!-- RIGHT STEM OF H (Classic Flared Column) -->
    <path
      d="M 268 48 L 318 48 C 312 58, 309 68, 309 84 L 309 186 C 309 202, 312 212, 318 222 L 268 222 C 274 212, 277 202, 277 186 L 277 84 C 277 68, 274 58, 268 48 Z"
      fill="url(#hv-stem-right)"
    />
    <!-- Specular Highlight Strip down Right Stem -->
    <rect x="288" y="58" width="7" height="154" fill="url(#hv-specular)" />

    <!-- 3D FLOWING CROSSBAR RIBBON (Loops from Left Stem, rises, twists into V descent) -->
    <!-- Ribbon Underside / Depth Shadow -->
    <path
      d="M 218 142 C 228 120, 248 98, 274 98 C 298 98, 314 114, 328 140 L 340 238 C 336 238, 328 228, 320 206 L 308 148 C 298 126, 286 114, 270 114 C 248 114, 234 130, 222 152 Z"
      fill="url(#hv-ribbon-inner)"
    />

    <!-- Main Dynamic Curved Ribbon (Top Satin Surface) -->
    <path
      d="M 216 138 C 234 104, 258 88, 286 92 C 312 95, 332 118, 345 158 L 342 242 C 338 238, 332 226, 326 202 L 312 144 C 302 118, 288 108, 272 108 C 248 108, 230 128, 216 156 Z"
      fill="url(#hv-ribbon-outer)"
    />

    <!-- Ribbon Gloss Highlight Edge -->
    <path
      d="M 218 138 C 236 106, 258 92, 284 94 C 308 97, 326 116, 338 152"
      fill="none"
      stroke="#EDE5F7"
      stroke-width="2.2"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- ASCENDING V-FLOURISH WING (Elegant Ribbon Petal / Crest with Hollow Cutout) -->
    <!-- Outer Wing Body -->
    <path
      d="M 336 238 C 342 208, 356 156, 372 108 C 384 72, 396 48, 404 42 C 404 46, 398 68, 390 98 C 382 128, 372 168, 360 208 C 354 228, 344 238, 336 238 Z"
      fill="url(#hv-wing-grad)"
    />

    <!-- Wing Gloss / Highlight Crest -->
    <path
      d="M 390 44 C 398 56, 403 66, 404 74 C 401 92, 388 134, 374 174 L 358 218"
      fill="none"
      stroke="#EDE5F7"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Subtle Inner Ribbon Bevel Corner for 3D realism -->
    <path
      d="M 336 238 L 342 232 C 346 220, 350 202, 354 182 L 348 186 C 342 210, 338 226, 336 238 Z"
      fill="#1A0233"
      opacity="0.6"
    />
  </g>

  <!-- ==================== TYPOGRAPHY LOCKUP ==================== -->
  <g id="hv-typography" fill="#17131D" text-anchor="middle">
    <!-- "HARPALANI" with classical display serif proportions -->
    <text
      x="300"
      y="282"
      font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
      font-size="28"
      font-weight="600"
      letter-spacing="0.28em"
      fill="#17131D"
    >
      HARPALANI
    </text>

    <!-- Flanking Hairline Rules for "VENTURES" -->
    <line x1="152" y1="305" x2="228" y2="305" stroke="#32106B" stroke-width="0.85" opacity="0.8" />
    
    <!-- "VENTURES" -->
    <text
      x="300"
      y="310"
      font-family="'Playfair Display', 'Cinzel', Georgia, serif"
      font-size="16"
      font-weight="500"
      letter-spacing="0.42em"
      fill="#32106B"
    >
      VENTURES
    </text>

    <line x1="372" y1="305" x2="448" y2="305" stroke="#32106B" stroke-width="0.85" opacity="0.8" />

    <!-- "PVT. LTD." -->
    <text
      x="300"
      y="335"
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="9.5"
      font-weight="600"
      letter-spacing="0.48em"
      fill="#6F2DBD"
    >
      PVT. LTD.
    </text>

    <!-- "BUILDING WHAT COMES NEXT." -->
    <text
      x="300"
      y="362"
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="8.5"
      font-weight="500"
      letter-spacing="0.34em"
      fill="#17131D"
      opacity="0.75"
    >
      BUILDING WHAT COMES NEXT.
    </text>
  </g>
</svg>
